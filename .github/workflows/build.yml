name: Build fonts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build 420 Taper
        run: uv run build.py 420-taper.toml

      - name: Package
        run: |
          mkdir -p package/420Taper
          cp dist/420Taper/*.ttf OFL.txt README.md package/420Taper/
          cd package && zip -r ../420Taper.zip 420Taper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 420Taper
          path: package/420Taper

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            420Taper.zip
            dist/420Taper/*.ttf
          generate_release_notes: true

      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew cask update"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum 420Taper.zip | cut -d' ' -f1)
          git clone -q "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/wk-j/homebrew-tap.git" tap
          cd tap
          cask=Casks/font-420-taper.rb
          sed -i -E "s/^  version \".*\"/  version \"${version}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" "$cask"
          if git diff --quiet; then
            echo "Cask already at ${version}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Update font-420-taper to ${version}"
          git push -q origin HEAD
